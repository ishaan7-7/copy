<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TelemetriX — Knowledge Repo</title>
<style>
  :root {
    --app-header-h: 46px;
    --app-page-pad: 10px;
    --app-gap: 10px;
    --app-font-xs: 10px;
    --app-font-sm: 11px;
    --app-font-md: 12px;
    --app-font-lg: 14px;
    --app-control-h: 34px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    font-size: var(--app-font-md);
    overflow: hidden;
    transition: background .25s ease, color .25s ease;
  }
  html[data-theme="light"] body {
    background:
      radial-gradient(circle at 12% 0%, rgba(251,78,11,0.07), transparent 27%),
      linear-gradient(145deg, #f8fafc 0%, #f2f6fa 52%, #fff8f3 100%);
    color: #16202d;
  }
  html[data-theme="dark"] body {
    background:
      radial-gradient(circle at 12% 0%, rgba(56,189,248,0.08), transparent 26%),
      linear-gradient(145deg, #050d17 0%, #07111e 52%, #091522 100%);
    color: #edf5ff;
  }

  .appbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--app-header-h);
    z-index: 1201;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--app-gap);
    padding: 0 var(--app-page-pad);
    transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  html[data-theme="light"] .appbar {
    background-color: #fff;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.98), rgba(255,250,247,0.96));
    border-bottom: 1px solid #ECECEC;
    box-shadow: 0 8px 24px rgba(15,47,69,0.08);
    backdrop-filter: blur(14px);
  }
  html[data-theme="dark"] .appbar {
    background-color: rgba(5,13,23,0.96);
    border-bottom: 1px solid rgba(125,211,252,0.14);
    box-shadow: 0 10px 30px rgba(0,0,0,0.32);
    backdrop-filter: blur(14px);
  }

  .left-group { display: flex; align-items: center; gap: 20px; min-width: 0; flex: 1; }
  .logo-group { display: flex; align-items: center; gap: 14px; cursor: pointer; flex-shrink: 0; user-select: none; }
  .logo-group img { width: 72px; display: block; }
  .wordmark { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -0.4px; display: flex; align-items: baseline; }
  html[data-theme="light"] .wordmark { color: #005071; }
  html[data-theme="dark"] .wordmark { color: #edf5ff; }
  .wordmark .x { font-size: 22px; color: #ed6c02; font-weight: 900; font-style: italic; font-family: "Arial Black", Arial, sans-serif; margin-left: 1px; }
  .subtitle { font-size: var(--app-font-xs); font-weight: 500; letter-spacing: 0.08em; line-height: 1.2; white-space: nowrap; margin-top: 2px; }
  html[data-theme="light"] .subtitle { color: #64748B; }
  html[data-theme="dark"] .subtitle { color: #9fb2c9; }

  .nav-tabs { display: flex; gap: 3.6px; align-items: center; padding: 4px; border-radius: 10px; flex: 1; min-width: 0; overflow: hidden; }
  .nav-tab {
    position: relative;
    height: 100%;
    min-height: 30px;
    width: 126px; min-width: 126px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px;
    cursor: default;
    font-size: var(--app-font-md);
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all .25s ease;
  }
  html[data-theme="light"] .nav-tab { color: #333; }
  html[data-theme="dark"] .nav-tab { color: #c8d7e8; }
  .nav-tab::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 2px;
    border-radius: 999px; transform: scaleX(0); transition: transform .25s ease, background-color .25s ease;
  }
  html[data-theme="light"] .nav-tab::after { background-color: rgba(251,78,11,.45); }
  html[data-theme="dark"] .nav-tab::after { background-color: #38bdf8; }
  html[data-theme="light"] .nav-tab:hover { color: #FB4E0B; background-color: rgba(251,78,11,.05); }
  html[data-theme="dark"] .nav-tab:hover { color: #edf5ff; background-color: rgba(56,189,248,.09); }
  .nav-tab:hover::after { transform: scaleX(1); }

  .right-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .role-select {
    height: var(--app-control-h);
    font-size: var(--app-font-sm);
    font-weight: 750;
    border-radius: 6px;
    padding: 0 26px 0 12px;
    min-width: 112px;
    cursor: pointer;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  }
  html[data-theme="dark"] .role-select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  }

  .icon-btn {
    width: var(--app-control-h); height: var(--app-control-h);
    border-radius: 8px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    background: transparent;
    transition: color .2s ease, background-color .2s ease;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  html[data-theme="light"] .icon-btn { color: #64748b; }
  html[data-theme="dark"] .icon-btn { color: #94a3b8; }
  html[data-theme="light"] .icon-btn:hover { background-color: rgba(251,78,11,.1); }
  html[data-theme="dark"] .icon-btn:hover { background-color: rgba(56,189,248,.1); }

  .icon-btn.active { }
  html[data-theme="light"] .icon-btn.active { color: #FB4E0B; background-color: rgba(251,78,11,.09); }
  html[data-theme="dark"] .icon-btn.active { color: #38bdf8; background-color: rgba(56,189,248,.12); }

  .badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 999px;
    background: #d32f2f; color: #fff;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    border: 2px solid transparent;
  }
  html[data-theme="light"] .badge { border-color: #fff; }
  html[data-theme="dark"] .badge { border-color: rgba(5,13,23,0.96); }

  .notif-pop {
    position: fixed;
    top: calc(var(--app-header-h) + 6px);
    right: var(--app-page-pad);
    width: 300px;
    padding: 10px;
    border-radius: 8px;
    z-index: 1300;
    display: none;
    box-shadow: 0 12px 32px rgba(0,0,0,0.22);
  }
  .notif-pop.open { display: block; }
  html[data-theme="light"] .notif-pop { background: #ffffff; border: 1px solid #e2e8f0; }
  html[data-theme="dark"] .notif-pop { background: #0f172a; border: 1px solid #1e293b; }
  .notif-title { font-size: 12px; font-weight: 800; margin-bottom: 7px; }
  .notif-item { display: flex; gap: 7px; padding: 7px; border-radius: 6px; margin-bottom: 6px; }
  html[data-theme="light"] .notif-item { background: #f8fafc; border: 1px solid #e2e8f0; }
  html[data-theme="dark"] .notif-item { background: #111827; border: 1px solid #1e293b; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .notif-body-text { font-size: 11px; font-weight: 800; }
  .notif-sub { font-size: 10px; opacity: .65; margin-top: 1px; }

  .main {
    position: fixed;
    top: var(--app-header-h);
    left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .main iframe { width: 100%; height: 100%; border: none; display: block; background: #fff; }
</style>
</head>

<script>
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  var moonIcon = document.getElementById('themeIconMoon');
  var sunIcon = document.getElementById('themeIconSun');
  var krFrame = document.getElementById('krFrame');

  function sendTheme(dark) {
    try {
      krFrame.contentWindow.postMessage(dark ? 'theme:dark' : 'theme:light', '*');
    } catch (e) {}
  }

  function applyTheme(dark) {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    moonIcon.style.display = dark ? 'none' : 'block';
    sunIcon.style.display = dark ? 'block' : 'none';
    themeBtn.title = dark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    sendTheme(dark);
    if (typeof applyRoleStyle === 'function') applyRoleStyle();
  }

  themeBtn.addEventListener('click', function () {
    var isDark = root.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
  });

  krFrame.addEventListener('load', function () {
    sendTheme(root.getAttribute('data-theme') === 'dark');
  });

  var notifBtn = document.getElementById('notifBtn');
  var notifPop = document.getElementById('notifPop');
  notifBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    notifPop.classList.toggle('open');
  });
  document.addEventListener('click', function () {
    notifPop.classList.remove('open');
  });
  notifPop.addEventListener('click', function (e) { e.stopPropagation(); });

  var roleColors = {
    monitoring: { color: '#0ea5e9', bgLight: 'rgba(14,165,233,0.07)', bgDark: 'rgba(14,165,233,0.12)', borderLight: 'rgba(14,165,233,0.34)' },
    executive: { color: '#8b5cf6', bgLight: 'rgba(139,92,246,0.07)', bgDark: 'rgba(139,92,246,0.12)', borderLight: 'rgba(139,92,246,0.34)' },
    engineering: { color: '#f97316', bgLight: 'rgba(249,115,22,0.07)', bgDark: 'rgba(249,115,22,0.12)', borderLight: 'rgba(249,115,22,0.34)' }
  };
  var roleSelect = document.getElementById('roleSelect');
  function applyRoleStyle() {
    var cfg = roleColors[roleSelect.value];
    var dark = root.getAttribute('data-theme') === 'dark';
    roleSelect.style.backgroundColor = dark ? cfg.bgDark : cfg.bgLight;
    roleSelect.style.border = '1px solid ' + cfg.borderLight;
    roleSelect.style.color = dark ? '#edf5ff' : '#16202d';
  }
  roleSelect.addEventListener('change', applyRoleStyle);
  applyRoleStyle();

  document.querySelector('.logo-group').addEventListener('click', function () {
    krFrame.contentWindow.location.hash = '';
  });
</script>
